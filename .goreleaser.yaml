version: 2

project_name: ags

before:
  hooks:
    - go mod tidy

builds:
  - id: ags
    main: ./cmd/ags
    binary: ags
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - android
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      # android/amd64 在 CGO_ENABLED=0 下需要 external linking，无法构建；
      # 只发布 Termux 主流的 android/arm64。
      - goos: android
        goarch: amd64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - README_zh.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
